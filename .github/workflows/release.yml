name: Build and Release MyBridge

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows x64 packages
        run: npm run build:win:x64

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: mybridge-windows-x64
          path: release/MyBridge-*-x64-Setup.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS arm64 DMG
        run: npm run build:mac:arm64

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: mybridge-macos-arm64
          path: release/MyBridge-*-arm64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mybridge-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          windows_asset="$(find release-assets -maxdepth 1 -type f -name 'MyBridge-*-x64-Setup.exe' -print -quit)"
          macos_asset="$(find release-assets -maxdepth 1 -type f -name 'MyBridge-*-arm64.dmg' -print -quit)"
          test -n "$windows_asset"
          test -n "$macos_asset"
          echo "Windows asset: $windows_asset"
          echo "macOS asset: $macos_asset"

      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          windows_asset="$(find release-assets -maxdepth 1 -type f -name 'MyBridge-*-x64-Setup.exe' -print -quit)"
          macos_asset="$(find release-assets -maxdepth 1 -type f -name 'MyBridge-*-arm64.dmg' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$windows_asset" "$macos_asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "MyBridge $GITHUB_REF_NAME"
